<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admit card holder | SevaSphere</title><meta name="description" content="Keep exam admit card details, dates and centres together. Print the list.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css"><link rel="stylesheet" href="assets/css/csc-system.css">
<style>@page{size:A4;margin:0}.doc{background:#fff;color:#111;padding:14mm;min-height:120mm;font:11pt/1.5 "Segoe UI",Arial,sans-serif;max-width:100%;overflow-x:auto}.doc table{width:100%;border-collapse:collapse}.doc th{background:#0b6e4f;color:#fff;text-align:left;padding:6px 8px}.doc td{border-bottom:1px solid #ccc;padding:6px 8px;vertical-align:top}.doc h2{margin-bottom:8px;color:#0b6e4f}.doc .rm{border:0;background:#fbe9e7;color:#b3261e;border-radius:6px;padding:3px 8px;cursor:pointer}@media print{.rm,.ed{display:none!important}}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Documents</div><h1>Admit card holder</h1><p>Keep exam admit card details, dates and centres together. Print the list.</p></div>
<div class="split"><section class="panel no-print"><h3 style="margin-bottom:8px">Add exam</h3><div class="field"><label for="en">Exam name</label><input id="en" type="text" value="SSC CGL 2026" placeholder=""></div><div class="row2"><div class="field"><label for="rn">Roll number</label><input id="rn" type="text" value="" placeholder=""></div><div class="field"><label for="ed">Exam date</label><input id="ed" type="date" value="" placeholder=""></div></div><div class="row2"><div class="field"><label for="et">Exam time</label><input id="et" type="text" value="10:00 AM" placeholder=""></div><div class="field"><label for="rt">Reporting time</label><input id="rt" type="text" value="08:30 AM" placeholder=""></div></div><div class="field"><label for="ec">Exam centre / address</label><input id="ec" type="text" value="" placeholder=""></div><div class="field"><label for="cn">Candidate name</label><input id="cn" type="text" value="" placeholder=""></div><div class="field"><label for="nt">Notes (documents to carry, etc.)</label><input id="nt" type="text" value="Admit card + original photo ID" placeholder=""></div><button class="btn" id="add"><i class="fa-solid fa-plus"></i> Save exam</button> <button class="btn alt" id="pr"><i class="fa-solid fa-print"></i> Print list</button><p class="note" style="margin-top:8px">Saved on this computer only. Clearing browser data removes it.</p></section><section><div class="paper doc" id="sheet"></div></section></div>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
let L=[];try{L=JSON.parse(localStorage.getItem('cscdesk_admit')||'[]');}catch(e){}
const save=()=>{try{localStorage.setItem('cscdesk_admit',JSON.stringify(L));}catch(e){}};
const dmy=s=>{if(!s)return '';const p=s.split('-');return p[2]+'-'+p[1]+'-'+p[0];};
const K=['en','rn','ed','et','rt','ec','cn','nt'];let editing=-1;
function draw(){const rows=L.slice().map((x,i)=>[x,i]).sort((a,b)=>(a[0].ed||'9')<(b[0].ed||'9')?-1:1);
$('sheet').innerHTML='<h2>My exam admit card details</h2>'+(L.length?'<table><tr><th>Exam</th><th>Roll no.</th><th>Date and time</th><th>Centre</th><th class="ed"></th></tr>'+rows.map(([x,i])=>'<tr><td><b>'+esc(x.en)+'</b><br>'+esc(x.cn)+'</td><td>'+esc(x.rn)+'</td><td>'+esc(dmy(x.ed))+'<br>Exam: '+esc(x.et)+'<br>Report: '+esc(x.rt)+'</td><td>'+esc(x.ec)+'<br><small>'+esc(x.nt)+'</small></td><td class="ed"><button class="rm" style="background:#e3f1ea;color:#0b6e4f" data-e="'+i+'">Edit</button> <button class="rm" data-d="'+i+'">Delete</button></td></tr>').join('')+'</table>':'<p>No exams saved yet. Fill the form and press Save exam.</p>');}
$('add').onclick=()=>{const o={};K.forEach(k=>o[k]=$(k).value.trim());if(!o.en){alert('Please enter the exam name.');return;}if(editing>=0){L[editing]=o;editing=-1;$('add').innerHTML='<i class="fa-solid fa-plus"></i> Save exam';}else L.push(o);save();K.forEach(k=>{if(k!=='cn')$(k).value='';});draw();};
$('sheet').onclick=e=>{const d=e.target.dataset;if(d.d!==undefined&&confirm('Delete this exam?')){L.splice(+d.d,1);save();draw();}if(d.e!==undefined){editing=+d.e;K.forEach(k=>$(k).value=L[editing][k]||'');$('add').innerHTML='<i class="fa-solid fa-check"></i> Update exam';window.scrollTo({top:0,behavior:'smooth'});}};
$('pr').onclick=()=>window.print();draw();
</script></body></html>
