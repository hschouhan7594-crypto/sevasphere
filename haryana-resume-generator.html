 if(ty=="sel")h='<select id="'+id+'">'+O(o,id=="dist"?"Rohtak":"")+"</select>";

var OBJ={
fresher:"A sincere and hardworking fresher seeking an opportunity to start my career in a reputed organization where I can learn, contribute and grow.|एक ईमानदार व परिश्रमी फ्रेशर, जो किसी प्रतिष्ठित संस्था में कॅरियर शुरू कर सीखने, योगदान देने और आगे बढ़ने का अवसर चाहता/चाहती है।~I humbly seek a position where I can use my education and skills for the growth of the organization and my own development.|मैं विनम्रतापूर्वक ऐसा पद चाहता/चाहती हूँ जहाँ अपनी शिक्षा व कौशल से संस्था के विकास और अपने विकास में योगदान दे सकूँ।",

grad:"A graduate with a good academic record and communication skills seeking a challenging role to grow along with the organization.|अच्छे शैक्षणिक रिकॉर्ड व संवाद कौशल वाला स्नातक, जो संस्था के साथ आगे बढ़ने हेतु चुनौतीपूर्ण भूमिका चाहता/चाहती है।~I humbly request an opportunity to utilise my education and abilities in a position that offers learning and growth.|मेरा विनम्र निवेदन है कि मुझे ऐसे पद पर अवसर मिले जहाँ मैं अपनी शिक्षा व क्षमताओं का उपयोग कर सीख व उन्नति पा सकूँ।",

exp:"An experienced and result-oriented professional seeking a senior opportunity to apply my experience for the organization's growth.|अनुभवी व परिणाम-उन्मुख पेशेवर, जो संस्था की प्रगति हेतु अपने अनुभव का उपयोग करने वाला उच्च अवसर चाहता/चाहती है।~I humbly seek a better position where my experience, discipline and loyalty can be fully utilised.|मैं बेहतर पद चाहता/चाहती हूँ जहाँ मेरे अनुभव, अनुशासन व निष्ठा का पूर्ण उपयोग हो सके।"};
