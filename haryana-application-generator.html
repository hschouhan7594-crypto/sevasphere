function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var DIST="Ambala|अंबाला~Bhiwani|भिवानी~Charkhi Dadri|चरखी दादरी~Faridabad|फरीदाबाद~Fatehabad|फतेहाबाद~Gurugram|गुरुग्राम~Hisar|हिसार~Jhajjar|झज्जर~Jind|जींद~Kaithal|कैथल~Karnal|करनाल~Kurukshetra|कुरुक्षेत्र~Mahendragarh|महेंद्रगढ़~Nuh|नूंह~Palwal|पलवल~Panchkula|पंचकूला~Panipat|पानीपत~Rewari|रेवाड़ी~Rohtak|रोहतक~Sirsa|सिरसा~Sonipat|सोनीपत~Yamunanagar|यमुनानगर";

var GS="I respectfully submit that I am a resident of the above address and wish to bring the following grievance to your kind notice.|सादर निवेदन है कि मैं उपरोक्त पते का निवासी हूँ और निम्नलिखित शिकायत आपके संज्ञान में लाना चाहता/चाहती हूँ।~With due respect, I have been facing a problem for a long time and wish to complain about it.|सविनय निवेदन है कि मैं लंबे समय से एक समस्या का सामना कर रहा/रही हूँ और उसकी शिकायत करना चाहता/चाहती हूँ।~This is a reminder of my earlier complaint on which no action has been taken so far.|यह मेरी पूर्व शिकायत का स्मरण-पत्र है, जिस पर अब तक कोई कार्यवाही नहीं हुई।~This matter causes public inconvenience, so I request your immediate attention.|यह मामला जनता की असुविधा से जुड़ा है, अतः आपके तत्काल ध्यान की आवश्यकता है।~Most humbly, I request your kind intervention in a matter that has caused me great hardship.|अत्यंत विनम्र निवेदन है कि जिस समस्या से मुझे भारी कठिनाई हुई है, उसमें आप कृपया हस्तक्षेप करें।";
var GE="I request you to kindly take necessary action at the earliest and inform me.|आपसे अनुरोध है कि कृपया शीघ्र आवश्यक कार्यवाही करें और मुझे सूचित करें।~Kindly resolve the matter within 15 days, failing which I will approach higher authorities / CM Window.|कृपया 15 दिन में समस्या का समाधान करें, अन्यथा मैं उच्च अधिकारियों / सीएम विंडो से संपर्क करूँगा/करूँगी।~I shall be grateful if strict action is taken against the persons responsible.|दोषी व्यक्तियों के विरुद्ध सख़्त कार्यवाही की जाए तो मैं आभारी रहूँगा/रहूँगी।~Please acknowledge receipt of this application and provide a complaint reference number.|कृपया इस आवेदन की प्राप्ति स्वीकार करें और शिकायत संदर्भ संख्या प्रदान करें।~I humbly pray for your kind and prompt justice. Thanking you.|आपसे न्याय एवं त्वरित कार्यवाही की विनम्र प्रार्थना है। धन्यवाद सहित।";

 f:[["husb","Late Husband's Name|स्वर्गीय पति का नाम","text",1],["dod","Date of Death|मृत्यु की तिथि","date",1],["dcno","Death Certificate No.|मृत्यु प्रमाणपत्र संख्या","text",0],["remar","Remarried?|पुनर्विवाह?","sel",1,YN]].concat(BANK)},

var SE={
oldage:["With due respect, I humbly beg to state that I am an elderly resident of Haryana and have no sufficient means of livelihood.|सविनय निवेदन है कि मैं हरियाणा का वृद्ध निवासी हूँ और मेरे पास आजीविका के पर्याप्त साधन नहीं हैं।~Most respectfully, I submit that due to my advanced age I am unable to earn and depend on others for my daily needs.|सादर निवेदन है कि अधिक आयु के कारण मैं कमाने में असमर्थ हूँ और दैनिक आवश्यकताओं के लिए दूसरों पर निर्भर हूँ।~I humbly request your kind attention to the fact that I fulfil the age and residence conditions of the Old Age Samman Allowance scheme.|विनम्र निवेदन है कि मैं वृद्धावस्था सम्मान भत्ता योजना की आयु व निवास संबंधी शर्तें पूरी करता/करती हूँ।","I shall remain ever grateful for your kind help and the early sanction of my pension.|आपकी कृपा से शीघ्र पेंशन स्वीकृत होने पर मैं सदैव आभारी रहूँगा/रहूँगी।~I humbly pray that you may kindly consider my case sympathetically and grant me this benefit in my old age.|मेरी विनम्र प्रार्थना है कि मेरे प्रकरण पर सहानुभूतिपूर्वक विचार कर वृद्धावस्था में यह सहायता प्रदान करने की कृपा करें।~Thanking you in anticipation of your kind and favourable action.|आपकी कृपापूर्ण एवं अनुकूल कार्यवाही की आशा में धन्यवाद सहित।"],
widow:["With folded hands, I humbly submit that after the loss of my husband I am struggling to run my household alone.|हाथ जोड़कर विनम्र निवेदन है कि पति के निधन के बाद मैं अकेले घर चलाने में कठिनाई का सामना कर रही हूँ।~Most respectfully, I state that I am a widow with no regular source of income and need government support.|सादर निवेदन है कि मैं विधवा हूँ, मेरी कोई नियमित आय नहीं है और मुझे सरकारी सहायता की आवश्यकता है।~I humbly bring to your kind notice that I am a permanent resident of Haryana and eligible for the Widow Pension scheme.|मैं विनम्रतापूर्वक आपके संज्ञान में लाना चाहती हूँ कि मैं हरियाणा की स्थायी निवासी हूँ और विधवा पेंशन के लिए पात्र हूँ।","I earnestly request you to kindly sanction my pension so that I can live with dignity. I shall be highly obliged.|मेरी विनम्र प्रार्थना है कि पेंशन स्वीकृत कर मुझे सम्मानपूर्वक जीवन जीने में सहयोग करें। मैं अत्यंत आभारी रहूँगी।~I humbly hope for your kind sympathy and favourable consideration of my case.|मुझे आपकी सहानुभूति और मेरे प्रकरण पर अनुकूल विचार की विनम्र आशा है।~Thanking you for your valuable time and kind support.|आपके बहुमूल्य समय और कृपापूर्ण सहयोग के लिए धन्यवाद सहित।"],
disab:["Most humbly, I state that I am a person with disability and face great difficulty in earning a livelihood.|अत्यंत विनम्र निवेदन है कि मैं दिव्यांगजन हूँ और आजीविका कमाने में बहुत कठिनाई का सामना कर रहा/रही हूँ।~With due respect, I submit that I hold a valid disability certificate and am eligible for the Disability Pension scheme.|सविनय निवेदन है कि मेरे पास वैध दिव्यांगता प्रमाणपत्र है और मैं दिव्यांगजन पेंशन योजना के लिए पात्र हूँ।~I humbly request your kind attention to my difficult circumstances caused by my disability.|मैं अपनी दिव्यांगता से उत्पन्न कठिन परिस्थितियों की ओर आपका विनम्र ध्यान आकर्षित करना चाहता/चाहती हूँ।","I humbly request you to kindly sanction my pension so that I can live with self-respect. I shall remain grateful.|विनम्र अनुरोध है कि पेंशन स्वीकृत कर मुझे आत्मसम्मान से जीवन जीने में सहयोग दें। मैं सदैव आभारी रहूँगा/रहूँगी।~I pray for your kind and compassionate consideration of my application.|मेरे आवेदन पर आपके दयापूर्ण एवं सहानुभूतिपूर्ण विचार की प्रार्थना है।~Thanking you in anticipation of your valuable support.|आपके बहुमूल्य सहयोग की आशा में धन्यवाद सहित।"],
child:["With folded hands, I humbly submit that the below-named child is dependent and needs care, education and support.|हाथ जोड़कर विनम्र निवेदन है कि नीचे उल्लिखित बच्चा आश्रित है और उसे देखभाल, शिक्षा एवं सहायता की आवश्यकता है।~Most respectfully, I state that due to the family's circumstances the child's upbringing has become difficult.|सादर निवेदन है कि पारिवारिक परिस्थितियों के कारण बच्चे का पालन-पोषण कठिन हो गया है।~I humbly bring to your kind notice that the child is a resident of Haryana and eligible for Dependent Children Aid.|मैं विनम्रतापूर्वक आपके संज्ञान में लाना चाहता/चाहती हूँ कि बच्चा हरियाणा का निवासी है और आश्रित बाल सहायता के लिए पात्र है।","I earnestly request you to kindly sanction the aid so that the child may have a secure future. I shall always be thankful.|कृपया सहायता स्वीकृत करें ताकि बच्चे का भविष्य सुरक्षित हो सके। मैं सदैव आभारी रहूँगा/रहूँगी।~I humbly hope for your kind and sympathetic consideration for the welfare of this child.|इस बच्चे के कल्याण हेतु आपके दयापूर्ण एवं सहानुभूतिपूर्ण विचार की विनम्र आशा है।~Thanking you for your kindness and support.|आपकी कृपा एवं सहयोग के लिए धन्यवाद सहित।"],
dobv:["With due respect, I humbly submit that there is a mistake / doubt in my recorded date of birth which needs verification.|सविनय निवेदन है कि मेरी अभिलेखित जन्मतिथि में त्रुटि / संदेह है, जिसका सत्यापन आवश्यक है।~Most respectfully, I state that my correct date of birth is supported by the documents attached herewith.|सादर निवेदन है कि मेरी सही जन्मतिथि संलग्न दस्तावेज़ों से प्रमाणित होती है।~I humbly request your kind attention to the discrepancy in my date of birth that is causing difficulty in official work.|मैं अपनी जन्मतिथि में अंतर की ओर विनम्र ध्यान आकर्षित करना चाहता/चाहती हूँ, जिससे सरकारी कार्यों में कठिनाई हो रही है।","I humbly request you to kindly verify / correct the record at the earliest. I shall remain obliged.|विनम्र अनुरोध है कि कृपया शीघ्र अभिलेख का सत्यापन / सुधार करें। मैं आपका आभारी रहूँगा/रहूँगी।~I am ready to provide any further document or clarification required by your office.|आपके कार्यालय द्वारा माँगे जाने पर मैं कोई भी अन्य दस्तावेज़ या स्पष्टीकरण देने को तैयार हूँ।~Thanking you in anticipation of your kind cooperation.|आपके कृपापूर्ण सहयोग की आशा में धन्यवाद सहित।"],
ration:["With due respect, I humbly state that my family depends on the Public Distribution System for its daily food needs.|सविनय निवेदन है कि मेरा परिवार दैनिक भोजन आवश्यकताओं के लिए सार्वजनिक वितरण प्रणाली पर निर्भर है।~Most respectfully, I submit that I do not have a valid ration card / my ration card needs an update.|सादर निवेदन है कि मेरे पास वैध राशन कार्ड नहीं है / मेरे राशन कार्ड में अद्यतन आवश्यक है।~I humbly bring to your kind notice that my family is eligible for ration facilities as per the details given below.|मैं विनम्रतापूर्वक आपके संज्ञान में लाना चाहता/चाहती हूँ कि नीचे दिए विवरण के अनुसार मेरा परिवार राशन सुविधा के लिए पात्र है।","I humbly request you to kindly issue the ration card at the earliest so that my family may receive its entitled ration. I shall be grateful.|विनम्र अनुरोध है कि राशन कार्ड शीघ्र जारी करें ताकि मेरे परिवार को देय राशन मिल सके। मैं आभारी रहूँगा/रहूँगी।~I pray for your kind consideration and early action on my request.|मेरे अनुरोध पर आपके कृपापूर्ण विचार एवं शीघ्र कार्यवाही की प्रार्थना है।~Thanking you for your kind help.|आपकी कृपापूर्ण सहायता के लिए धन्यवाद सहित।"],
elec:["With due respect, I humbly state that I need an electricity connection at my premises for daily household / business needs.|सविनय निवेदन है कि मुझे अपने परिसर में दैनिक घरेलू / व्यावसायिक आवश्यकताओं हेतु बिजली कनेक्शन की आवश्यकता है।~Most respectfully, I submit that I am the owner / occupant of the premises mentioned below and have no electricity connection.|सादर निवेदन है कि मैं नीचे लिखे परिसर का स्वामी / अधिभोगी हूँ और वहाँ बिजली कनेक्शन नहीं है।~I humbly request your kind attention to my need for a new electricity connection at the earliest.|मैं नए बिजली कनेक्शन की शीघ्र आवश्यकता की ओर आपका विनम्र ध्यान आकर्षित करना चाहता/चाहती हूँ।","I humbly request you to kindly sanction the connection at the earliest. I shall complete all formalities and pay the dues. I shall be grateful.|विनम्र अनुरोध है कि कनेक्शन शीघ्र स्वीकृत करें। मैं सभी औपचारिकताएँ पूरी कर देय शुल्क जमा करूँगा/करूँगी। मैं आभारी रहूँगा/रहूँगी।~I pray for your kind and early action in the matter.|इस विषय में आपकी कृपापूर्ण एवं शीघ्र कार्यवाही की प्रार्थना है।~Thanking you for your kind cooperation.|आपके कृपापूर्ण सहयोग के लिए धन्यवाद सहित।"]};

water:["With due respect, I humbly state that my household has no regular water connection and faces difficulty in getting safe drinking water.|सविनय निवेदन है कि मेरे घर में नियमित जल कनेक्शन नहीं है और स्वच्छ पेयजल पाने में कठिनाई होती है।~Most respectfully, I submit that I am the owner / occupant of the premises below and wish to obtain a legal water connection.|सादर निवेदन है कि मैं नीचे लिखे परिसर का स्वामी / अधिभोगी हूँ और वैध जल कनेक्शन लेना चाहता/चाहती हूँ।","I humbly request you to kindly sanction the connection at the earliest; I shall pay all charges and remain grateful.|विनम्र अनुरोध है कि कनेक्शन शीघ्र स्वीकृत करें; मैं सभी शुल्क जमा करूँगा/करूँगी और आभारी रहूँगा/रहूँगी।~"+TY],
sewer:["With due respect, I humbly submit that my premises has no sewerage connection, causing health and sanitation problems.|सविनय निवेदन है कि मेरे परिसर में सीवरेज कनेक्शन नहीं है, जिससे स्वास्थ्य व सफाई की समस्या हो रही है।~Most respectfully, I state that I wish to connect my premises to the public sewer line as per rules.|सादर निवेदन है कि मैं नियमानुसार अपने परिसर को सार्वजनिक सीवर लाइन से जोड़ना चाहता/चाहती हूँ।","I humbly request you to kindly approve the connection soon; I shall follow all rules and pay the fee.|विनम्र अनुरोध है कि कनेक्शन शीघ्र स्वीकृत करें; मैं सभी नियमों का पालन करूँगा/करूँगी और शुल्क जमा करूँगा/करूँगी।~"+TY],
wbill:["With due respect, I humbly bring to your notice that the water bill received by me is incorrect.|सविनय निवेदन है कि मुझे प्राप्त पानी का बिल गलत है, यह आपके संज्ञान में लाना चाहता/चाहती हूँ।~Most respectfully, I submit that I have been billed unfairly and request a review of my account.|सादर निवेदन है कि मुझे अनुचित बिल भेजा गया है और मेरे खाते की समीक्षा का अनुरोध है।","I humbly request you to kindly correct the bill and not levy any penalty until the matter is resolved.|विनम्र अनुरोध है कि बिल सही करें और समाधान तक कोई जुर्माना न लगाया जाए।~"+TY],
elname:["With due respect, I humbly state that the electricity connection at my premises is still in a different name.|सविनय निवेदन है कि मेरे परिसर का बिजली कनेक्शन अभी भी किसी अन्य नाम पर है।~Most respectfully, I submit that I am the present lawful owner / occupant and wish to get the connection in my name.|सादर निवेदन है कि मैं वर्तमान वैध स्वामी / अधिभोगी हूँ और कनेक्शन अपने नाम कराना चाहता/चाहती हूँ।","I humbly request you to kindly change the name at the earliest; I shall complete all formalities and remain grateful.|विनम्र अनुरोध है कि नाम शीघ्र बदलने की कृपा करें; मैं सभी औपचारिकताएँ पूरी करूँगा/करूँगी और आभारी रहूँगा/रहूँगी।~"+TY],
elbill:["With due respect, I humbly bring to your kind notice that my electricity bill is higher than my actual consumption.|सविनय निवेदन है कि मेरा बिजली बिल वास्तविक खपत से अधिक आया है, यह आपके संज्ञान में लाना चाहता/चाहती हूँ।~Most respectfully, I state that the bill appears wrong and request an inquiry into my meter and reading.|सादर निवेदन है कि बिल गलत प्रतीत होता है और मीटर व रीडिंग की जाँच का अनुरोध है।","I humbly request you to kindly revise the bill and not disconnect my supply during the inquiry.|विनम्र अनुरोध है कि बिल सही करें और जाँच के दौरान मेरा कनेक्शन न काटा जाए।~"+TY],
lostprop:["With due respect, I humbly report that I have lost the property / documents described below.|सविनय निवेदन है कि मेरा नीचे लिखा सामान / दस्तावेज़ गुम हो गया है।~Most respectfully, I state that I searched everywhere but could not find the item(s), hence this report.|सादर निवेदन है कि मैंने हर जगह खोजा पर सामान नहीं मिला, इसलिए यह रिपोर्ट दे रहा/रही हूँ।","I humbly request you to kindly register the report and give me a copy for obtaining duplicate documents.|विनम्र अनुरोध है कि रिपोर्ट दर्ज कर उसकी प्रति दें ताकि मैं डुप्लीकेट दस्तावेज़ बनवा सकूँ।~If found by anyone, I request that I be informed. Thanking you.|यदि सामान किसी को मिले तो मुझे सूचित किया जाए। धन्यवाद सहित।"],

ppp:["With due respect, I humbly state that there is an error / change needed in my family's PPP record.|सविनय निवेदन है कि मेरे परिवार के पीपीपी रिकॉर्ड में त्रुटि है / बदलाव आवश्यक है।~Most respectfully, I submit that the wrong PPP data is hindering my family from getting government benefits.|सादर निवेदन है कि गलत पीपीपी डेटा के कारण सरकारी योजनाओं का लाभ लेने में बाधा आ रही है।","I humbly request you to kindly correct the record soon so that my family gets its due benefits.|विनम्र अनुरोध है कि रिकॉर्ड शीघ्र सही करें ताकि मेरे परिवार को देय लाभ मिल सके।~"+TY],
bdcert:["With due respect, I humbly state that I need to get the birth / death event registered or certified as per the details below.|सविनय निवेदन है कि नीचे दिए विवरण के अनुसार जन्म / मृत्यु का पंजीकरण या प्रमाणपत्र आवश्यक है।~Most respectfully, I submit that the event took place as stated and I am enclosing the available proof.|सादर निवेदन है कि घटना उल्लिखित विवरण के अनुसार हुई थी और उपलब्ध प्रमाण संलग्न हैं।","I humbly request you to kindly register / issue the certificate at the earliest. I shall be thankful.|विनम्र अनुरोध है कि प्रमाणपत्र शीघ्र पंजीकृत / जारी करें। मैं आभारी रहूँगा/रहूँगी।~"+TY],
bankchg:["With due respect, I humbly state that my pension bank account has changed and I request its update.|सविनय निवेदन है कि मेरा पेंशन बैंक खाता बदल गया है और मैं उसे अद्यतन कराना चाहता/चाहती हूँ।~Most respectfully, I submit that my pension is not reaching me through the old account.|सादर निवेदन है कि पुराने खाते में मेरी पेंशन नहीं पहुँच रही है।","I humbly request you to kindly update the account so that my pension is credited without delay.|विनम्र अनुरोध है कि खाता अद्यतन करें ताकि पेंशन बिना देरी जमा हो सके।~"+TY],
landrec:["With due respect, I humbly state that there is a mistake in my land record, causing difficulty to me and my family.|सविनय निवेदन है कि मेरे भूमि रिकॉर्ड में त्रुटि है, जिससे मुझे व मेरे परिवार को कठिनाई हो रही है।~Most respectfully, I submit the land details below along with supporting revenue documents.|सादर निवेदन है कि नीचे भूमि विवरण सहायक राजस्व दस्तावेज़ों सहित प्रस्तुत है।","I humbly request you to kindly correct the record after due inquiry. I shall be grateful.|विनम्र अनुरोध है कि उचित जाँच के बाद रिकॉर्ड सही करें। मैं आभारी रहूँगा/रहूँगी।~"+TY]
